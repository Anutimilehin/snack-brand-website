<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf6ee" />
    <meta
      name="description"
      content="Meet Jidex Foods Nigeria Limited. Discover a food brand bringing flavour to the moments we share."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Jidex Foods Nigeria Limited | More Flavour, More to Share</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore a React Router path redirected here by public/404.html on GitHub Pages.
      // The marker prevents collision with regular website query parameters.
      (function restoreGitHubPagesRoute(location) {
        const parameters = new URLSearchParams(location.search)
        const marker = parameters.get('__jidex_pages_redirect__')
        const route = parameters.get('__jidex_pages_route__')

        if (marker !== '1' || !route) return

        const basePath = location.pathname.endsWith('/')
          ? location.pathname.slice(0, -1)
          : location.pathname
        const query = parameters.get('__jidex_pages_query__')
        const hash = parameters.get('__jidex_pages_hash__')
        const target = `${basePath}${route.startsWith('/') ? route : `/${route}`}${query ? `?${query}` : ''}${hash ? `#${hash}` : ''}`

        window.history.replaceState(null, '', target)
      })(window.location)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
